generate_service_layer:
  description: >
    Extract relevant information from {api_result} to generate the service layer for the Spring Boot application.
    Based on the extracted service methods, create a fully functional service layer with the following steps:
    - Identify all service methods from {api_result} and generate corresponding Java service classes.
    - Implement methods in the service classes to interact with the entity layer for all CRUD operations.
    - Entity layer result is {entity_result}; use this to generate the service layer.
    - Identify necessary repository methods that need to be defined for data access.
    - Create corresponding Spring Data JPA repository interfaces based on the service layer requirements.
    - Implement custom query methods in the repository layer using derived queries or `@Query` annotations where necessary.
    - Compare generated service classes and repository interfaces against the task list provided in {api_result} by the tech lead and perform any missing tasks.
    - Ensure necessary imports are included for all annotations and classes.

  expected_output: >
    Java service class files dynamically generated based on {api_result} and {entity_result}.
      - Ensure service classes follow Spring Boot best practices and are properly structured.
      
    Java repository interface files dynamically generated based on service layer requirements.
      - Ensure repository interfaces include all necessary methods required by the service layer.

validate_service_layer:
  description: >
    Validate the generated service and repository classes for correctness.
    - Ensure all required service methods exist and follow business logic from {api_result}.
    - Verify that service methods correctly interact with the model and repository layers.
    - Check if required repository methods are present and correctly implemented.
    - Ensure service classes use `@Service` and dependency injection (`@Autowired` or constructor injection).
    - Validate that repository interfaces extend `JpaRepository<T, ID>` and use correct Spring Data JPA methods.
    - Ensure all necessary imports and annotations are correctly applied.

  expected_output: >
    - If validation **passes**:
      Create java service class files for handling business logic, adhering to the existing boilerplate folder structure at {folder_path}.
      - The generated files should be placed in the existing boilerplate folder structure within {folder_path}/service.
      - If no folder exists with name 'service' at {folder_path}, create a folder named 'service' and place the generated files inside.
      - Ensure service classes follow Spring Boot best practices and are properly structured.
      Create java repository interface files dynamically generated based on service layer requirements.
      - The generated files should be placed in the existing boilerplate folder structure at {folder_path}/repository.
      - If no folder exists with name 'repository' at {folder_path}, create a folder named `repository` and place the generated files inside.
      - Ensure repository interfaces include all necessary methods required by the service layer.
      
    - If validation **fails**, discard the generated output and trigger the generate_service_layer task again.
    - report : Final report after validation
    - result : Final class files approved after validation.  I don't want path I want only class files.
    
    
